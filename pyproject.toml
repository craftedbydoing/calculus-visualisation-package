[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calc_package"
version = "0.1.0"
description = "Interactive calculus visualizations for teaching"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]